plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.streamezy.capture'
    compileSdk 36

    defaultConfig {
        applicationId "com.streamezy.capture"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:2.1.10'
        force 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
        force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // RootEncoder RTMP & Stream Engine
    implementation 'com.github.pedroSG94.RootEncoder:library:2.8.1'
    implementation 'com.github.pedroSG94.RootEncoder:extra-sources:2.8.1'
    implementation 'com.herohan:UVCAndroid:1.0.13'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}