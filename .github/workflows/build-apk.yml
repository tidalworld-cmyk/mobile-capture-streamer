name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee ../build.log || true
          if [ ! -f app/build/outputs/apk/debug/*.apk ]; then
            echo "Build failed. Pushing failure log..."
            cd ..
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git checkout -b build-error-log
            cp build.log build_failure.txt
            git add build_failure.txt
            git commit -m "debug: full build failure log"
            git push -f origin build-error-log
            exit 1
          fi

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/*.apk release-artifacts/StreamEzy-Capture-v3.0-LiveU-Bonded.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamEzy-Capture-v3.0-LiveU-Bonded.apk
          path: release-artifacts/StreamEzy-Capture-v3.0-LiveU-Bonded.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v3.0.0-liveu
          name: "StreamEzy Capture v3.0.0 — LiveU-Style Video Bonding & Low-Bandwidth Edition"
          body: |
            ## 🚀 StreamEzy Capture v3.0.0 — LiveU-Style Video Bonding Edition

            Compiled automatically via GitHub Actions CI/CD.

            ### 🌟 New in v3.0.0 (LiveU Bonding & Broadcast Enhancement):
            - **LiveU-Style Forward Error Correction (FEC)**: XOR-based 0-RTT packet recovery across multiple paths.
            - **Selective NACK & Hybrid ARQ**: Fast retransmission for missing packets before playout buffer deadline.
            - **Multi-Path Bonding Engine**: Intelligent round-robin and latency-aware scheduling across Wi-Fi + Cellular (SIM 1 / SIM 2).
            - **Ultra-Low Bandwidth Field Transmission (100 kbps)**: Broadcast smoothly even in congested rural/weak signal areas with VPS cloud broadcast enhancement.
            - **In-App Bitrate Selector (100k / 500k / 1000k / 2500k)**: Easily switch between ultra-low bandwidth uplink and standard HD streaming.
            - **Network Center HUD**: Real-time interface health, latency, packet loss, and live bandwidth breakdown.
            - **Auto-Failover & Reconnect**: Seamlessly switches between paths and direct RTMP fallback without interrupting the stream.

            ### 🎥 Core Features Retained:
            - **Triple-Switch Live Dock**: Front Camera, Rear Camera, and OTG HDMI Video Capture Card (`UVCAndroid`).
            - **Locked 30 FPS** hardware H.264 / AAC RTMP output.
            - **16:9 Landscape & 9:16 Portrait Shorts** mode switcher.
            - **Audio VU Meter** & background audio controls.

            ### 📥 Installation:
            Download and install `StreamEzy-Capture-v3.0-LiveU-Bonded.apk` onto your Android phone and grant Camera/Audio/USB permissions when prompted.
          files: release-artifacts/StreamEzy-Capture-v3.0-LiveU-Bonded.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}