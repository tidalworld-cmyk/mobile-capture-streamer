name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee ../build.log || true
          if [ ! -f app/build/outputs/apk/debug/*.apk ]; then
            echo "Build failed. Pushing failure log..."
            cd ..
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git checkout -b build-error-log
            cp build.log build_failure.txt
            git add build_failure.txt
            git commit -m "debug: full build failure log"
            git push -f origin build-error-log
            exit 1
          fi

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/*.apk release-artifacts/StreamEzy-Capture-v2.0-BondStream.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamEzy-Capture-v2.0-BondStream.apk
          path: release-artifacts/StreamEzy-Capture-v2.0-BondStream.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0-bondstream
          name: "StreamEzy Capture v2.0.0 — Multi-Network Cellular Bonding Edition"
          body: |
            ## 🚀 StreamEzy Capture v2.0.0 — BondStream Edition
            
            Compiled automatically via GitHub Actions CI/CD.
            
            ### 🌟 New in v2.0.0 (Cellular Bonding System):
            - **Speedify-Style Multi-Path Cellular Bonding**: Combine Wi-Fi + Cellular (SIM 1 / SIM 2) simultaneously for aggregate bandwidth and zero-drop live streaming.
            - **In-App Multi-Path Benchmark Mode**: 5-second connection health & throughput test directly from the app settings.
            - **Live On-Screen Bonding HUD Overlay**: Real-time combined bitrate, latency, packet loss, and active network interfaces (`Wi-Fi ● SIM 1 ●`).
            - **Automatic Fallback Protection**: Seamlessly falls back to direct RTMP if multi-path bonding experiences an auth failure or server timeout.
            - **Replay Attack & Stream Key Auth Security**: Cryptographic token validation with `AUTH_FAIL` defense.
            
            ### 🎥 Core Features Retained:
            - **Triple-Switch Live Dock**: Front Camera, Rear Camera, and OTG HDMI Video Capture Card (`UVCAndroid`).
            - **Locked 30 FPS & 1000 kbps** hardware H.264 / AAC RTMP output.
            - **16:9 Landscape & 9:16 Portrait Shorts** mode switcher.
            - **Audio VU Meter** & background audio controls.
            
            ### 📥 Installation:
            Download and install `StreamEzy-Capture-v2.0-BondStream.apk` onto your Android phone and grant Camera/Audio/USB permissions when prompted.
          files: release-artifacts/StreamEzy-Capture-v2.0-BondStream.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}