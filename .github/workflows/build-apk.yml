name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/*.apk release-artifacts/StreamEzy-Capture-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamEzy-Capture-v1.0.apk
          path: release-artifacts/StreamEzy-Capture-v1.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-build
          name: "StreamEzy Capture v1.0.0 (Android APK)"
          body: |
            ## 📱 StreamEzy Capture Android APK
            
            Compiled automatically via GitHub Actions CI/CD.
            
            ### Features:
            - **Type-C OTG HDMI Capture Card Support** (`UVCAndroid` hardware driver).
            - **Triple-Switch Live Dock**: Front Camera, Rear Camera, and OTG HDMI Video Capture Card.
            - **Locked 30 FPS & 1000 kbps** hardware H.264 / AAC RTMP output.
            - **16:9 Landscape & 9:16 Portrait Shorts** mode switcher.
            - Pre-configured for YouTube Live & StreamEzy VPS Relay.
            
            ### Installation:
            Download and install `StreamEzy-Capture-v1.0.apk` onto your Android phone and grant Camera/Audio/USB permissions when prompted.
          files: release-artifacts/StreamEzy-Capture-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
